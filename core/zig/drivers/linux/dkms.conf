# UFS Filesystem - DKMS Configuration
# Place in /usr/src/ufs-<version>/dkms.conf

PACKAGE_NAME="ufs"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="ufs"
BUILT_MODULE_LOCATION[0]="/"
DEST_MODULE_LOCATION[0]="/kernel/fs/ufs"
AUTOINSTALL="yes"

# Kernel versions to build for (empty = all)
# KERNEL_VERSIONS="5.15 6.1 6.6 6.8"

# Build command - uses the Makefile in the source tree
MAKE[0]="'make' -C . KDIR=/lib/modules/${kernelver}/build"
CLEAN="'make' -C . clean"

# Module dependencies
# No external deps - UFS core is linked statically

# Post-install: update module dependencies
POST_INSTALL="depmod -a ${kernelver}"

# Pre-remove
PRE_REMOVE="depmod -a ${kernelver}"

# Configuration for different kernel configs
CONF_CHECK="config_check"

# Disable DKMS for kernels without required features
# REMAKE_INITRD="yes"

# Optional: sign modules for Secure Boot
# MODULE_SIG_KEY="/path/to/signing_key.priv"
# MODULE_SIG_CERT="/path/to/signing_key.x509"